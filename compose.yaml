services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: masjid
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-masjid_local}
      POSTGRES_DB: masjid_community
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - masjid_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U masjid -d masjid_community"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  masjid_data:
