name: Verify rebuilt apps
on:
  push:
    branches: [development]
  pull_request:
    branches: [development]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-web:
    name: PostgreSQL schema, types and web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: staff-web
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: masjid_ci
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: masjid_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U masjid_ci -d masjid_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://masjid_ci:ci_only_password@127.0.0.1:5432/masjid_ci
      AUTH_SECRET: ci-not-for-production-000000000000000000000
      MFA_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      STRIPE_SECRET_KEY: sk_test_ci_synthetic_no_network
      STRIPE_WEBHOOK_SECRET: whsec_ci_synthetic_no_network
      # Synthetic confidentiality policy in disposable CI only. Real care
      # intake is disabled by default in all other environments.
      SILA_CARE_INTAKE_ENABLED: "true"
      SILA_CARE_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      SILA_CARE_POLICY_HOURS: "Synthetic CI: weekdays between 9am and 5pm. No staffed care service."
      SILA_CARE_POLICY_RESPONSE: "Synthetic CI: expected review within three business days; no guarantee."
      SILA_CARE_POLICY_LIMITS: "Synthetic CI: requests are reviewed by explicitly assigned, trained volunteers. Confidentiality may be limited by safety and reporting obligations."
      SILA_CARE_POLICY_EMERGENCY: "Synthetic CI: this is not an emergency service. For immediate danger contact local emergency services or a qualified crisis provider."
      SILA_INVITE_CI_CAPTURE: "test-only" # only on disposable /masjid_ci, never a production feature
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx prisma migrate status
      - run: node scripts/test-db.mjs
      - run: npm run check
      - run: npm run build
      - name: Web and public API smoke
        run: |
          trap 'echo "--- Next.js server log ---"; tail -n 140 /tmp/masjid-next.log || true' ERR
          npm run start > /tmp/masjid-next.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health > /tmp/health.json; then break; fi
            sleep 2
          done
          cat /tmp/health.json
          curl -fsS http://127.0.0.1:3000/api/v1/public/home > /tmp/home.json
          node -e "const d=require('/tmp/home.json');if(!d.data?.organization)process.exit(1);"
          curl -fsS http://127.0.0.1:3000/api/v1/public/prayers > /tmp/prayers.json
          node -e "const d=require('/tmp/prayers.json');if(!Array.isArray(d.data?.days))process.exit(1);"
          node scripts/test-auth.mjs
          node scripts/test-staff-invitations.mjs
          node scripts/test-gather.mjs
          node scripts/test-event-checkin.mjs
          node scripts/test-circles.mjs
          node scripts/test-school-scope.mjs
          node scripts/test-attendance-corrections.mjs
          node scripts/test-school-capacity.mjs
          node scripts/test-school-waitlist.mjs
          node scripts/test-community-scope.mjs
          node scripts/test-notification-scope.mjs
          node scripts/test-care-intake.mjs
          node scripts/test-privacy-scope.mjs
          node scripts/test-privacy-export.mjs
          node scripts/test-shift-safety.mjs
          node scripts/test-payments.mjs
          node scripts/test-payout-register.mjs
          node scripts/test-public.mjs
          node scripts/test-delivery.mjs

  verify-mobile:
    name: Native app TypeScript and package compatibility
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: masjid-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npx expo install --check
  source:
    name: Verify source inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
