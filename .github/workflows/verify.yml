name: Verify rebuilt apps
on:
  push:
    branches: [development]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-web:
    name: PostgreSQL schema, types and web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: staff-web
    env:
      DATABASE_URL: postgresql://unused:unused@127.0.0.1:5432/masjid
      AUTH_SECRET: ci-not-for-production-000000000000000000000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npm run check
      - run: npm run build
  verify-mobile:
    name: Native app TypeScript and package compatibility
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: masjid-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npx expo install --check
  source:
    name: Verify source inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
