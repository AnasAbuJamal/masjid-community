name: Verify rebuilt apps
on:
  push:
    branches: [development]
  pull_request:
    branches: [development]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-web:
    name: PostgreSQL schema, types and web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: staff-web
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: masjid_ci
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: masjid_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U masjid_ci -d masjid_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://masjid_ci:ci_only_password@127.0.0.1:5432/masjid_ci
      AUTH_SECRET: ci-not-for-production-000000000000000000000
      SILA_AUDIT_HMAC_KEY: a1b2c3d4e5f60718a1b2c3d4e5f60718a1b2c3d4e5f60718a1b2c3d4e5f60718 # distinct, disposable CI only
      MFA_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      STRIPE_SECRET_KEY: sk_test_ci_synthetic_no_network
      STRIPE_WEBHOOK_SECRET: whsec_ci_synthetic_no_network
      # Synthetic confidentiality policy in disposable CI only. Real care
      # intake is disabled by default in all other environments.
      SILA_CARE_INTAKE_ENABLED: "true"
      SILA_CARE_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      SILA_CARE_POLICY_HOURS: "Synthetic CI: weekdays between 9am and 5pm. No staffed care service."
      SILA_CARE_POLICY_RESPONSE: "Synthetic CI: expected review within three business days; no guarantee."
      SILA_CARE_POLICY_LIMITS: "Synthetic CI: requests are reviewed by explicitly assigned, trained volunteers. Confidentiality may be limited by safety and reporting obligations."
      SILA_CARE_POLICY_EMERGENCY: "Synthetic CI: this is not an emergency service. For immediate danger contact local emergency services or a qualified crisis provider."
      SILA_INVITE_CI_CAPTURE: "test-only" # only on disposable /masjid_ci, never a production feature
      # Signed synthetic worker in a disposable CI database; never contacts
      # Resend or other external mail providers.
      CRON_SECRET: ci-internal-worker-secret-000000000000000000000000
      SILA_OPERATIONS_SECRET: ci-operations-readonly-secret-00000000000000000
      SILA_DELIVERY_CI_CAPTURE: "test-only"
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx prisma migrate status
      - run: node scripts/test-db.mjs
      # Actual logical pg_dump -> fresh database -> pg_restore -> Prisma
      # verification. This touches ONLY GitHub Actions' disposable postgres
      # service, never any connected/staging/production database.
      - name: Disposable PostgreSQL backup and restore rehearsal
        shell: bash
        env:
          SILA_RESTORE_DATABASE_URL: postgresql://masjid_ci:ci_only_password@127.0.0.1:5432/masjid_ci_restore
        run: |
          set -euo pipefail
          test "${GITHUB_ACTIONS:-}" = true
          test "$DATABASE_URL" = "postgresql://masjid_ci:ci_only_password@127.0.0.1:5432/masjid_ci"
          test "$SILA_RESTORE_DATABASE_URL" = "postgresql://masjid_ci:ci_only_password@127.0.0.1:5432/masjid_ci_restore"
          if ! command -v pg_dump >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client >/dev/null
          fi
          # pg_dump must not be older than the PostgreSQL 16 CI service.
          if [ "$(pg_dump --version | grep -oE '[0-9]+' | head -n 1)" -lt 16 ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client-16 >/dev/null
          fi
          export PGHOST=127.0.0.1 PGPORT=5432 PGUSER=masjid_ci PGPASSWORD=ci_only_password
          ARCHIVE="$(mktemp /tmp/sila-ci-restore-XXXXXXXX.dump)"
          trap 'rm -f "$ARCHIVE"; dropdb --if-exists masjid_ci_restore >/dev/null 2>&1 || true' EXIT
          pg_dump --format=custom --no-owner --no-acl --file="$ARCHIVE" masjid_ci
          createdb masjid_ci_restore
          pg_restore --single-transaction --exit-on-error --no-owner --no-acl --dbname=masjid_ci_restore "$ARCHIVE"
          node scripts/test-restore.mjs
          DATABASE_URL="$SILA_RESTORE_DATABASE_URL" npx prisma migrate status
      - run: npm run check
      - run: npm run build
      - name: Web and public API smoke
        run: |
          trap 'echo "--- Next.js server log ---"; tail -n 140 /tmp/masjid-next.log || true' ERR
          npm run start > /tmp/masjid-next.log 2>&1 &
          # Fail closed: neither a failed liveness probe nor exhausted
          # readiness retries may be hidden by a later successful API call.
          ready=0
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 5 \
              --dump-header /tmp/sila-ready-headers \
              --output /tmp/health.json http://127.0.0.1:3000/api/ready; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1
          curl --fail --silent --show-error --max-time 5 \
            --dump-header /tmp/sila-live-headers \
            --output /tmp/liveness.json http://127.0.0.1:3000/api/health
          node -e "const fs=require('node:fs');for(const [file,status,check] of [['/tmp/health.json','ready',null],['/tmp/liveness.json','alive','liveness']]){const body=JSON.parse(fs.readFileSync(file,'utf8'));if(body.data?.status!==status||(check&&body.data?.check!==check))throw Error('Invalid probe: '+file)}"
          # Probes are real-time signals; stale intermediary responses must
          # not be used to decide whether an instance receives traffic.
          grep -iq '^cache-control: no-store' /tmp/sila-ready-headers
          grep -iq '^cache-control: no-store' /tmp/sila-live-headers
          cat /tmp/health.json
          curl -fsS http://127.0.0.1:3000/api/v1/public/home > /tmp/home.json
          node -e "const d=require('/tmp/home.json');if(!d.data?.organization)process.exit(1);"
          curl -fsS http://127.0.0.1:3000/api/v1/public/prayers > /tmp/prayers.json
          node -e "const d=require('/tmp/prayers.json');if(!Array.isArray(d.data?.days))process.exit(1);"
          node scripts/test-auth.mjs
          node scripts/test-staff-invitations.mjs
          node scripts/test-integrity-audit.mjs
          node scripts/test-audit-review.mjs
          node scripts/test-gather.mjs
          node scripts/test-event-checkin.mjs
          node scripts/test-circles.mjs
          node scripts/test-school-scope.mjs
          node scripts/test-attendance-corrections.mjs
          node scripts/test-school-capacity.mjs
          node scripts/test-school-waitlist.mjs
          node scripts/test-community-scope.mjs
          node scripts/test-notification-scope.mjs
          node scripts/test-tenant-context.mjs
          node scripts/test-venue-emergencies.mjs
          node scripts/test-care-intake.mjs
          node scripts/test-privacy-scope.mjs
          node scripts/test-privacy-export.mjs
          node scripts/test-shift-safety.mjs
          node scripts/test-payments.mjs
          node scripts/test-payout-register.mjs
          node scripts/test-public.mjs
          node scripts/test-delivery-consent.mjs
          node scripts/test-delivery.mjs
          node scripts/test-operations.mjs

  verify-mobile:
    name: Native app TypeScript and package compatibility
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: masjid-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npx expo install --check
  source:
    name: Verify source inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
