name: Prune merged feature branches after verification

on:
  workflow_run:
    workflows: ["Verify web and mobile"]
    types: [completed]
    branches: [development]

# Deletion is guarded by the specific consolidation parent, commit title,
# a successful CI run, and exact old branch SHAs.
permissions:
  contents: write

jobs:
  prune:
    name: Remove redundant branches if integration passed
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'development' && github.event.workflow_run.head_repository.full_name == github.repository }}
    steps:
      - name: Verify refs, then delete the two merged branches
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          node <<'NODE'
          const repo = process.env.GH_REPO;
          const sha = process.env.VERIFIED_SHA;
          const token = process.env.GH_TOKEN;
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: 'Bearer ' + token,
            'X-GitHub-Api-Version': '2022-11-28',
          };
          async function request(path, method = 'GET') {
            const response = await fetch('https://api.github.com/repos/' + repo + '/' + path, {
              method, headers,
            });
            if (!response.ok) {
              const message = await response.text();
              throw Error(method + ' ' + path + ': HTTP ' + response.status + ' ' + message.slice(0, 350));
            }
            return response.status === 204 ? null : response.json();
          }
          async function ref(branch) {
            return (await request('git/ref/heads/' + branch)).object.sha;
          }
          (async () => {
            const current = await ref('development');
            if (current !== sha) {
              console.log('Skipped cleanup: development moved after verified CI.');
              return;
            }
            const commit = await request('git/commits/' + sha);
            if (commit.message.trim() !== 'chore: finish verified consolidation' ||
                commit.parents.length !== 1 ||
                commit.parents[0].sha !== 'e0f7645f7842e01b964abc447e843f01949734fc') {
              console.log('Skipped cleanup: not the authorized one-time consolidation revision.');
              return;
            }
            const redundant = [
              ['codex/completion-and-database-readiness', 'faa4fd30d918ba711864d9a22efc6fd49b5de1e6'],
              ['fix/security-functionality-apple-ui-20261026', 'd5e3fd6e59b246a81912335c11d08bb3f84627fd'],
            ];
            for (const [branch, expected] of redundant) {
              if (await ref(branch) !== expected) {
                throw Error('Branch changed; no deletion: ' + branch);
              }
            }
            for (const [branch] of redundant) {
              await request('git/refs/heads/' + branch, 'DELETE');
              console.log('Deleted merged branch: ' + branch);
            }
            console.log('Consolidation cleanup complete; development is the sole branch.');
          })().catch(err => { console.error(err.message); process.exitCode = 1; });
          NODE
