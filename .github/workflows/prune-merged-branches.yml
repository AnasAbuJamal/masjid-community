name: Remove redundant merged branches

on:
  push:
    branches: [development]
    paths:
      - '.github/workflows/prune-merged-branches.yml'

permissions:
  contents: write

jobs:
  prune:
    name: Retain only development
    runs-on: ubuntu-latest
    steps:
      - name: Remove unchanged redundant refs after verified consolidation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          node <<'NODE'
          const repo = process.env.GH_REPO;
          const expectedHead = process.env.EXPECTED_HEAD;
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: 'Bearer ' + process.env.GH_TOKEN,
            'X-GitHub-Api-Version': '2022-11-28',
          };
          async function api(path, method='GET') {
            const response = await fetch('https://api.github.com/repos/' + repo + '/' + path, { method, headers });
            if (!response.ok) throw Error(method + ' ' + path + ': HTTP ' + response.status + ' ' + (await response.text()).slice(0, 400));
            return response.status === 204 ? null : response.json();
          }
          async function sha(branch) {
            return (await api('git/ref/heads/' + branch)).object.sha;
          }
          (async () => {
            const main = await api('');
            if (main.default_branch !== 'development') throw Error('Expected default branch development');
            if (await sha('development') !== expectedHead) throw Error('Development moved; refusing cleanup');
            const commit = await api('git/commits/' + expectedHead);
            if (commit.message.trim() !== 'chore: delete merged branches, keep development' ||
                commit.parents.length !== 1 ||
                commit.parents[0].sha !== '62cd1e22bf63719e6a85f4377cb2e409309c4926') {
              throw Error('Unexpected consolidation commit; refusing cleanup');
            }
            const old = [
              ['codex/completion-and-database-readiness', 'faa4fd30d918ba711864d9a22efc6fd49b5de1e6'],
              ['fix/security-functionality-apple-ui-20261026', 'd5e3fd6e59b246a81912335c11d08bb3f84627fd'],
            ];
            for (const [branch, expected] of old) {
              if (await sha(branch) !== expected) throw Error('Branch changed since consolidation: ' + branch);
            }
            for (const [branch] of old) {
              await api('git/refs/heads/' + branch, 'DELETE');
              console.log('Deleted: ' + branch);
            }
            console.log('Only development remains');
          })().catch(e => { console.error(e); process.exitCode = 1; });
          NODE
